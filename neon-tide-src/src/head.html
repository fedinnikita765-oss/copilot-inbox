<title>Neon Tide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0716">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800;900&display=swap">
<style>
:root{
  /* Layout: full-bleed WebGL city; HUD pinned to the safe-area corners; menus are frosted panels over the live scene */
  --ink:#0c0716; --ink-2:#170d2b; --glass:rgba(20,11,40,.58); --glass-hi:rgba(58,30,96,.78); --line:rgba(255,236,220,.17);
  --fg:#fff4ea; --fg-dim:rgba(255,244,234,.68);
  --sun:#ff8a3d; --pink:#ff3f8e; --cyan:#3fe5ef; --gold:#ffd23f; --lime:#8dff7a; --red:#ff4d5e; --blue:#4d8dff;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --b:clamp(54px,12.5vmin,74px);
  --map:clamp(100px,19vmin,148px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 95% at 50% 50%,rgba(0,0,0,0) 58%,rgba(8,2,20,.42) 100%)}
#hurt{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .25s;
  background:radial-gradient(110% 90% at 50% 50%,rgba(255,0,40,0) 55%,rgba(255,20,60,.55) 100%)}
#touch{position:absolute;inset:0;z-index:4;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ---------- HUD ---------- */
#mapWrap{position:absolute;left:calc(14px + var(--sl));top:calc(12px + var(--st));width:var(--map);height:var(--map)}
#minimap{width:100%;height:100%;border-radius:50%;display:block;background:#10354f;
  box-shadow:0 0 0 2px rgba(255,255,255,.2),0 10px 26px rgba(0,0,0,.5)}
#hpRing{position:absolute;left:-7px;top:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);overflow:visible}
#hpRing circle{fill:none;stroke-width:4;stroke-linecap:round}
#hpBg{stroke:rgba(255,255,255,.12)}
#hpFg{stroke:var(--lime);transition:stroke-dashoffset .3s,stroke .3s}
#topRight{position:absolute;right:calc(70px + var(--sr));top:calc(10px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:5px}
#clock{font:600 12px/1 var(--display);color:var(--fg-dim);letter-spacing:.1em;font-variant-numeric:tabular-nums}
#money{font:800 clamp(19px,4.4vmin,30px)/1 var(--display);color:var(--lime);font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 18px rgba(141,255,122,.35)}
#stars{display:flex;gap:3px}
.star{width:clamp(15px,3.4vmin,22px);height:clamp(15px,3.4vmin,22px);fill:rgba(255,255,255,.13);stroke:rgba(0,0,0,.45);stroke-width:1.2}
.star.on{fill:var(--gold);filter:drop-shadow(0 0 6px rgba(255,210,63,.6))}
#stars.flash .star.on{animation:blink .6s steps(2,start) infinite}
@keyframes blink{50%{fill:rgba(255,255,255,.25);filter:none}}
#pauseBtn{position:absolute;right:calc(14px + var(--sr));top:calc(12px + var(--st));width:46px;height:46px;border-radius:14px;
  pointer-events:auto;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#pauseBtn svg{width:18px;height:18px}
#objective{position:absolute;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);max-width:min(52vw,560px);
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
  padding:8px 14px;font:700 clamp(12px,2.7vmin,15px)/1.3 var(--body);display:flex;gap:10px;align-items:center;transition:opacity .3s}
#objective.off{opacity:0}
#objDot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
#objMeta{font:700 12px/1 var(--display);color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
#sms{position:absolute;top:calc(60px + var(--st));left:50%;width:min(420px,58vw);transform:translate(-50%,-14px);opacity:0;
  transition:opacity .35s,transform .35s;display:flex;gap:10px;align-items:flex-start;background:rgba(250,245,255,.94);color:#1a1030;
  border-radius:18px;padding:10px 14px 11px 10px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
#sms.show{opacity:1;transform:translate(-50%,0)}
#smsAva{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--display);color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--sun))}
#sms b{display:block;font:800 12px/1.2 var(--body);letter-spacing:.04em;color:#6a3fb0;margin-bottom:2px}
#sms p{margin:0;font:600 13.5px/1.35 var(--body)}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;opacity:0;transform:scale(.92);transition:opacity .4s,transform .4s}
#banner.show{opacity:1;transform:scale(1)}
#bannerSub{font:700 clamp(11px,2.4vmin,14px)/1 var(--body);letter-spacing:.38em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#bannerTitle{font:900 clamp(28px,8.5vmin,66px)/1.02 var(--display);letter-spacing:.01em;padding:0 16px;text-wrap:balance;
  background:linear-gradient(180deg,#fff6d1 0%,var(--gold) 46%,var(--sun) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(30,6,40,.7))}
#banner.bad #bannerTitle{background:linear-gradient(180deg,#ffd6dc 0%,#ff5a6e 55%,#b0103a 100%);-webkit-background-clip:text;background-clip:text}
#toasts{position:absolute;right:calc(14px + var(--sr));top:calc(108px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.toast{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font:700 13px/1.2 var(--body);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:toastIn .25s ease-out;transition:opacity .4s}
.toast.cash{color:var(--lime)} .toast.warn{color:#ffb3bd}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}}
#speedo{position:absolute;left:50%;bottom:calc(12px + var(--sb));transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
#spdVal{font:900 clamp(26px,7vmin,46px)/1 var(--display);font-variant-numeric:tabular-nums;color:var(--fg);text-shadow:0 0 22px rgba(63,229,239,.5),0 3px 0 rgba(0,0,0,.5)}
#speedo small{font:700 10px/1 var(--body);letter-spacing:.3em;color:var(--fg-dim)}
#spdRow{display:flex;align-items:flex-end;gap:8px}
#gearVal{font:800 clamp(14px,3.4vmin,20px)/1 var(--display);color:var(--gold);min-width:1.2em;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--glass)}
#tach{width:110px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#tach i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan) 0%,var(--cyan) 70%,var(--gold) 82%,var(--red) 100%);background-size:110px 100%}
#carHp{width:110px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
#carHp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--lime));background-size:110px 100%;transition:width .3s}
#radio{font:700 10px/1 var(--body);letter-spacing:.2em;color:var(--pink);text-transform:uppercase;opacity:.9}

#stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(255,255,255,.24);
  background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,.02) 70%);opacity:.5;transition:opacity .2s;
  left:calc(110px + var(--sl));top:calc(100% - 120px - var(--sb))}
#stick.on{opacity:.9}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#d9d0ff 60%,#a99be0);box-shadow:0 6px 18px rgba(0,0,0,.45)}
#btns{position:absolute;right:calc(18px + var(--sr));bottom:calc(20px + var(--sb));width:1px;height:1px}
.btn{pointer-events:auto;position:absolute;width:var(--b);height:var(--b);border-radius:50%;display:grid;place-items:center;padding:0;
  background:var(--glass);border:1.5px solid var(--line);color:var(--fg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  touch-action:none;transition:transform .08s,background .15s,border-color .15s;cursor:pointer}
.btn svg{width:44%;height:44%;pointer-events:none}
.btn span{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font:800 9.5px/1 var(--body);letter-spacing:.08em;
  text-transform:uppercase;color:var(--fg-dim);text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
.btn.down{transform:scale(.92);background:var(--glass-hi);border-color:var(--cyan)}
.btn.on{background:var(--glass-hi);border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,63,.35)}
.btn.big{width:calc(var(--b)*1.22);height:calc(var(--b)*1.22)}
.btn.hot{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.22),0 0 24px rgba(255,210,63,.4);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,210,63,.08),0 0 30px rgba(255,210,63,.5)}}
/* foot cluster */
#bPunch{right:0;bottom:0}
#bJump{right:calc(var(--b)*1.42);bottom:calc(var(--b)*-.05)}
#bEnter{right:calc(var(--b)*.12);bottom:calc(var(--b)*1.55)}
#bSprint{right:calc(var(--b)*1.5);bottom:calc(var(--b)*1.25)}
/* car cluster */
#bGas{right:0;bottom:0}
#bBrake{right:calc(var(--b)*1.46);bottom:calc(var(--b)*-.05)}
#bHand{right:calc(var(--b)*1.55);bottom:calc(var(--b)*1.2)}
#bExit{right:calc(var(--b)*.12);bottom:calc(var(--b)*1.55)}
#bHorn{right:calc(var(--b)*2.75);bottom:calc(var(--b)*.55)}
#bNitro{right:calc(var(--b)*.2);bottom:calc(var(--b)*2.85)}
#bGas{border-color:rgba(141,255,122,.45)}
#bBrake{border-color:rgba(255,77,94,.45)}
.hidden{display:none!important}

/* ---------- overlays ---------- */
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity .6s}
#dead{position:absolute;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .5s;
  backdrop-filter:grayscale(1) contrast(1.15) brightness(.8);-webkit-backdrop-filter:grayscale(1) contrast(1.15) brightness(.8)}
#dead.show{opacity:1}
#deadText{font:900 clamp(34px,10vmin,84px)/1 var(--display);color:var(--red);letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.6);text-align:center;padding:0 16px}
#deadText small{display:block;margin-top:14px;font:700 clamp(12px,2.6vmin,16px)/1.3 var(--body);letter-spacing:.2em;color:var(--fg);text-transform:uppercase}
#dead.busted #deadText{color:var(--blue)}

#menu{position:absolute;inset:0;z-index:20;display:flex;align-items:center;
  padding-left:calc(max(22px,6vw) + var(--sl));padding-right:calc(22px + var(--sr));padding-top:calc(16px + var(--st));padding-bottom:calc(16px + var(--sb));
  background:linear-gradient(90deg,rgba(12,7,22,.86) 0%,rgba(12,7,22,.5) 46%,rgba(12,7,22,0) 78%);transition:opacity .6s}
#menu.gone{opacity:0;pointer-events:none}
.mcol{display:flex;flex-direction:column;gap:clamp(10px,2.4vmin,18px);max-width:min(520px,92vw)}
.eyebrow{font:800 clamp(10px,2.1vmin,12px)/1 var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--cyan)}
.logo{margin:0;font:900 clamp(44px,13vmin,112px)/.86 var(--display);letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff0b8 0%,#ffb35c 30%,#ff5f6d 58%,#ff3f8e 74%,#8f45ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(40,8,50,.55)) drop-shadow(0 0 30px rgba(255,80,140,.35))}
.logo span{display:block}
.lede{margin:0;font:600 clamp(13px,2.7vmin,16px)/1.5 var(--body);color:var(--fg-dim);max-width:42ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.play{pointer-events:auto;border:0;cursor:pointer;border-radius:999px;padding:clamp(12px,2.6vmin,16px) clamp(26px,5vmin,40px);
  font:800 clamp(14px,3vmin,18px)/1 var(--display);letter-spacing:.06em;color:#24062b;
  background:linear-gradient(90deg,var(--gold),var(--sun) 45%,var(--pink));box-shadow:0 10px 30px rgba(255,63,142,.35),inset 0 -3px 0 rgba(0,0,0,.18)}
.play:active{transform:scale(.97)}
.play[disabled]{opacity:.5;filter:grayscale(.5)}
.ghost{pointer-events:auto;cursor:pointer;border-radius:999px;padding:10px 18px;font:700 13px/1 var(--body);
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg)}
.ghost:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{pointer-events:auto;cursor:pointer;border-radius:999px;padding:7px 12px;font:700 12px/1 var(--body);border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg-dim)}
.chip.on{background:rgba(63,229,239,.16);border-color:var(--cyan);color:var(--fg)}
.label{font:800 10px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--fg-dim)}
#load{display:flex;flex-direction:column;gap:8px;width:min(320px,70vw)}
#loadTxt{font:700 12px/1 var(--body);color:var(--fg-dim);letter-spacing:.06em}
#loadBar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .2s}
.keys{font:600 11.5px/1.6 var(--body);color:var(--fg-dim)}
.keys b{color:var(--fg);font-weight:800}
#rotateHint{display:none;font:700 12px/1.4 var(--body);color:var(--gold)}
@media (orientation:portrait){#rotateHint{display:block}}

#pause{position:absolute;inset:0;z-index:22;display:grid;place-items:center;background:rgba(10,5,20,.55);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  padding:calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl))}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;background:rgba(24,13,46,.82);
  border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3.5vmin,26px);pointer-events:auto;touch-action:pan-y}
.panel h2{margin:0;font:900 clamp(22px,5vmin,32px)/1 var(--display);background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat b{font:800 clamp(14px,3.4vmin,19px)/1 var(--display);font-variant-numeric:tabular-nums;color:var(--fg)}
.stat span{font:700 10px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-dim)}
.set{display:flex;flex-direction:column;gap:7px}
.slider{width:100%;accent-color:var(--pink);pointer-events:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:700 12px/1.3 var(--body);color:#ffb3bd}
#err{position:absolute;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;background:var(--ink);font:700 15px/1.5 var(--body)}
@media (prefers-reduced-motion:reduce){.btn.hot,#stars.flash .star.on{animation:none}}
</style>
